server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location ^~ /portals/patient/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Only versioned portal assets are public; never return an SPA fallback.
  location / { return 404; }
}
