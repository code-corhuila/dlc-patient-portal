name: dlc-patient-portal
services:
  patient-portal-demo:
    container_name: patient-portal-demo
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - '${PATIENT_DEMO_PORT:-4177}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
# Default network: dlc-patient-portal_default; dlc-front will join it in its own PR.
